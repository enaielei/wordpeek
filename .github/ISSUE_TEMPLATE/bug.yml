name: Bug report
description: Report incorrect behavior in WordPeek
title: 'fix: '
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: What happened, and what should have happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use non-sensitive example words only.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: WordPeek version, Windows version, and source application
    validations:
      required: true
